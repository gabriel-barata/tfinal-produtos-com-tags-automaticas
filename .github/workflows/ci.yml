name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Hash de str varia por processo; fixar evita testes flaky na HashTable.
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          # Mesma versão do backend/Dockerfile, para builds reproduzíveis.
          version: "0.12.22"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
